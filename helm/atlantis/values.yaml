# Atlantis — official chart, zero owned artifacts:
# upstream image + runtime terraform download (ATLANTIS_TF_DOWNLOAD) + kubectl via initContainer.
# Bootstrap: helm upgrade --install atlantis runatlantis/atlantis -n ops -f this-file
# Later: import as helm_release in terraform/platform (same pattern as traefik/authentik).
image:
  repository: ghcr.io/runatlantis/atlantis
  tag: "v0.49.0"            # pinned; Renovate bumps
  pullPolicy: IfNotPresent

atlantisUrl: "https://atlantis.vanderloch.com:2459"  # rides the existing outbound DNAT, host-routed with headscale
orgAllowlist: "github.com/lochis-lab/kube"

github:
  user: Lochis
# credentials live in k8s Secret atlantis-vcs (keys: github_token, github_secret) — never in this repo
vcsSecretName: atlantis-vcs

# TF state backend RBAC (Secret+Lease in ops ns) — chart-managed
enableKubernetesBackend: true

# server-side governance: allow repo config to pick workflows + apply requirements
repoConfig: |
  repos:
    - id: /.*/
      allowed_overrides: [workflow, apply_requirements]
      allow_custom_workflows: true

# tier-3 internal values injected at apply time (see atlantis.yaml apps workflow)
environmentSecrets:
  - name: TF_VAR_nfs_media_server
    secretKeyRef: { name: atlantis-app-vars, key: NFS_MEDIA_SERVER }
  - name: TF_VAR_searxng_secret
    secretKeyRef: { name: atlantis-app-vars, key: SEARXNG_SECRET }
  - name: TF_VAR_webshare_proxy_url
    secretKeyRef: { name: atlantis-app-vars, key: WEBSHARE_PROXY_URL }
  - name: TF_VAR_osu_mongodb_uri
    secretKeyRef: { name: atlantis-app-vars, key: OSU_MONGODB_URI }
  - name: TF_VAR_osu_client_secret
    secretKeyRef: { name: atlantis-app-vars, key: OSU_CLIENT_SECRET }
  - name: TF_VAR_osu_session_secret
    secretKeyRef: { name: atlantis-app-vars, key: OSU_SESSION_SECRET }
  - name: TF_VAR_authentik_secret_key
    secretKeyRef: { name: atlantis-app-vars, key: AUTHENTIK_SECRET_KEY }
  - name: TF_VAR_authentik_bootstrap_password
    secretKeyRef: { name: atlantis-app-vars, key: AUTHENTIK_BOOTSTRAP_PASSWORD }
  - name: TF_VAR_authentik_postgresql_password
    secretKeyRef: { name: atlantis-app-vars, key: AUTHENTIK_POSTGRESQL_PASSWORD }
  - name: TF_VAR_authentik_redis_password
    secretKeyRef: { name: atlantis-app-vars, key: AUTHENTIK_REDIS_PASSWORD }
  - name: TF_VAR_mongo_root_password
    secretKeyRef: { name: atlantis-app-vars, key: MONGO_ROOT_PASSWORD }
  - name: TF_VAR_lavalink_server_password
    secretKeyRef: { name: atlantis-app-vars, key: LAVALINK_SERVER_PASSWORD }
  - name: TF_VAR_lavalink_spotify_client_id
    secretKeyRef: { name: atlantis-app-vars, key: LAVALINK_SPOTIFY_CLIENT_ID }
  - name: TF_VAR_lavalink_spotify_client_secret
    secretKeyRef: { name: atlantis-app-vars, key: LAVALINK_SPOTIFY_CLIENT_SECRET }
  - name: TF_VAR_lavalink_yt_oauth_refresh_token
    secretKeyRef: { name: atlantis-app-vars, key: LAVALINK_YT_OAUTH_REFRESH_TOKEN }

environment:
  ATLANTIS_LOG_LEVEL: info
  ATLANTIS_TF_DOWNLOAD: "true"           # chart image ships without terraform

defaultTFDistribution: terraform
defaultTFVersion: "1.17.0"               # match repo required_version

# kubectl for the apps/ custom workflow — copied from the official image into /tools
initContainers:
  - name: kubectl
    image: docker.io/library/alpine:3.24
    command: ["/bin/sh", "-c", "wget -qO /tools/kubectl https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl && chmod +x /tools/kubectl"]  # pin matches cluster server
    volumeMounts:
      - { name: kubectl-tools, mountPath: /tools }
extraVolumes:
  - name: kubectl-tools
    emptyDir: {}
extraVolumeMounts:
  - { name: kubectl-tools, mountPath: /tools }
extraPath: "/tools"

volumeClaim:
  enabled: true
  dataStorage: 5Gi
  storageClassName: longhorn

service:
  type: ClusterIP

ingress:
  enabled: false                          # routing via Traefik IngressRoute (see terraform/infra/bootstrap/)

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [k3s-worker-01, k3s-worker-02] }
