# SearXNG — canonical source (this repo). Cluster-internal search backend for firecrawl /v2/search.
# Secrets (__SEARXNG_SECRET__, __WEBSHARE_PROXY_URL__) rendered at apply time from k8s Secret atlantis-app-vars.
---
apiVersion: v1
kind: Namespace
metadata:
  name: searxng
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: searxng
data:
  settings.yml: |
    use_default_settings:
      engines:
        keep_only:
          - bing          # works via datacenter IPs (verified 200)
          - google        # 302s but usually parseable; drop if captcha-y
          - mojeek        # crawler-owned index, proxy-friendly
          - wikipedia     # if still timing out via proxy, remove this line
    # NOTE: default search category is "web" in this SearXNG version but the
    # kept engines are tagged "general" only → zero engines selected →
    # empty results with NO unresponsive_engines. Re-tag into both:
    engines:
      - name: bing
        disabled: false    # listed engines default to disabled — must flip
        categories: [general, web]
      - name: google
        disabled: false
        categories: [general, web]
      - name: mojeek
        disabled: false
        categories: [general, web]
      - name: wikipedia
        disabled: false
        categories: [general, web]
    server:
      secret_key: "__SEARXNG_SECRET__"  # rendered at apply from atlantis-app-vars
      limiter: false            # cluster-internal; no bot protection needed
      image_proxy: false
    search:
      formats:
        - html
        - json                  # REQUIRED for Firecrawl (disabled by default)
      safe_search: 0
      autocomplete: ""
    # Route ALL engine queries through webshare (verified: CONNECT works,
    # bing/ddg/marginalia respond fine; google 302s datacenter IPs as usual).
    # Rotating gateway → new exit IP per engine request.
    outgoing:
      proxies:
        all://:
          - __WEBSHARE_PROXY_URL__  # rendered at apply from atlantis-app-vars
    # user-agent unblocked: searxng sends its own UA per engine by default;
    # engines accept it — leave as-is unless results thin out.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searxng
  labels:
    app: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
        - name: searxng
          image: docker.io/searxng/searxng@sha256:23482d8ecf7ddf66029479468ea04c1bb11d2b65785a17a7e629e2ffd13296ca  # rolling release: digest-pinned (running digest == latest at migration); Renovate bumps digests
          env:
            - name: SEARXNG_BASE_URL
              value: "http://searxng.searxng.svc:8080/"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: settings
          configMap:
            name: searxng-settings
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: searxng
spec:
  selector:
    app: searxng
  ports:
    - port: 8080
      targetPort: 8080
