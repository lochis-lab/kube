---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.portainer.kubernetes.application.kind: content
    io.portainer.kubernetes.application.name: ''
    io.portainer.kubernetes.application.owner: admin
    io.portainer.kubernetes.application.stack: ''
    io.portainer.kubernetes.application.stackid: '343'
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: audiobookshelf
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: audiobookshelf
    spec:
      containers:
      - env:
        - name: TZ
          value: America/Toronto
        image: ghcr.io/advplyr/audiobookshelf:2.37.2
        imagePullPolicy: Always
        name: audiobookshelf
        ports:
        - containerPort: 80
          protocol: TCP
        - containerPort: 13378
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /metadata
          name: metadata
        - mountPath: /audiobooks
          name: audiobooks
        - mountPath: /podcasts
          name: podcasts
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: abs-config
      - name: metadata
        persistentVolumeClaim:
          claimName: abs-metadata
      - name: audiobooks
        nfs:
          path: /srv/audiobooks
          server: __NFS_MEDIA_SERVER__
      - name: podcasts
        nfs:
          path: /srv/podcasts
          server: __NFS_MEDIA_SERVER__
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.portainer.kubernetes.application.kind: content
    io.portainer.kubernetes.application.name: ''
    io.portainer.kubernetes.application.owner: admin
    io.portainer.kubernetes.application.stack: ''
    io.portainer.kubernetes.application.stackid: '343'
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  ports:
  - name: http
    port: 2459
    protocol: TCP
    targetPort: 80
  - name: ws
    port: 2460
    protocol: TCP
    targetPort: 13378
  selector:
    app: audiobookshelf
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels:
    io.portainer.kubernetes.application.kind: content
    io.portainer.kubernetes.application.name: ''
    io.portainer.kubernetes.application.owner: admin
    io.portainer.kubernetes.application.stack: ''
    io.portainer.kubernetes.application.stackid: '343'
  name: audiobookshelf
  namespace: audiobookshelf
  annotations:
    kubernetes.io/ingress.class: traefik-external
    traefik.ingress.kubernetes.io/websocket: 'true'
spec:
  entryPoints:
  - outbound
  routes:
  - kind: Rule
    match: Host(`abs.vanderloch.com`)
    services:
    - name: audiobookshelf
      port: 2459
      scheme: http
  tls:
    secretName: lochis-tls
