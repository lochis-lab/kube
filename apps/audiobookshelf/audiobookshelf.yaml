apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.portainer.kubernetes.application.kind: content
    io.portainer.kubernetes.application.name: ''
    io.portainer.kubernetes.application.owner: admin
    io.portainer.kubernetes.application.stack: ''
    io.portainer.kubernetes.application.stackid: '343'
  name: audiobookshelf
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: audiobookshelf
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: audiobookshelf
    spec:
      containers:
      - env:
        - name: TZ
          value: America/Toronto
        image: ghcr.io/advplyr/audiobookshelf@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa  # was :latest; upstream release at export time: v2.37.2
        imagePullPolicy: Always
        name: audiobookshelf
        ports:
        - containerPort: 80
          protocol: TCP
        - containerPort: 13378
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /metadata
          name: metadata
        - mountPath: /audiobooks
          name: audiobooks
        - mountPath: /podcasts
          name: podcasts
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: abs-config
      - name: metadata
        persistentVolumeClaim:
          claimName: abs-metadata
      - name: audiobooks
        nfs:
          path: /srv/audiobooks
          server: 192.168.10.201
      - name: podcasts
        nfs:
          path: /srv/podcasts
          server: 192.168.10.201
