metadata:
  labels:
    io.portainer.kubernetes.application.kind: content
    io.portainer.kubernetes.application.name: ''
    io.portainer.kubernetes.application.owner: admin
    io.portainer.kubernetes.application.stack: ''
    io.portainer.kubernetes.application.stackid: '342'
  name: jackett
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: jackett
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: jackett
    spec:
      containers:
      - env:
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: TZ
          value: Etc/UTC
        - name: AUTO_UPDATE
          value: 'true'
        - name: RUN_OPTS
        image: lscr.io/linuxserver/jackett@sha256:19d90927b95397f2d1364e4999e11456abdbbb382b54cd765fc3b3da24d7088b  # was :latest (LSIO publishes rolling tags)
        imagePullPolicy: Always
        name: jackett
        ports:
        - containerPort: 9117
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /config
          name: jackett-config
        - mountPath: /downloads/audiobooks
          name: downloads-audiobooks
        - mountPath: /downloads/podcasts
          name: downloads-podcasts
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: jackett-config
        persistentVolumeClaim:
          claimName: jackett-data
      - name: downloads-audiobooks
        nfs:
          path: /srv/downloads/audiobooks
          server: 192.168.10.201
      - name: downloads-podcasts
        nfs:
          path: /srv/downloads/podcasts
          server: 192.168.10.201
      - name: audiobooks
        nfs:
          path: /srv/audiobooks
          server: 192.168.10.201
      - name: podcasts
        nfs:
          path: /srv/podcasts
          server: 192.168.10.201
