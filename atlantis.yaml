version: 3
# Atlantis repo config. Solo operator: approvals can't come from the PR author,
# so apply gate = mergeable + undiverged.
projects:
  - name: terraform-infra
    dir: terraform/infra
    autoplan: { when_modified: ["**/*.tf"] }
    apply_requirements: [mergeable, undiverged]
  - name: terraform-platform
    dir: terraform/platform
    autoplan: { when_modified: ["**/*.tf"] }
    apply_requirements: [mergeable, undiverged]
  - name: apps
    dir: apps
    workflow: kubectl
    autoplan: { when_modified: ["**/*.yaml"] }
    apply_requirements: [mergeable, undiverged]
workflows:
  kubectl:
    plan:
      steps:
        # render __PLACEHOLDERS__ from pod env (atlantis-app-vars secret) into a temp copy,
        # assert none remain, then dry-run — object names only in PR comments
        # (full diffs would echo rendered internal values into a public repo)
        - run: >-
            sh -c "rm -rf /tmp/r && cp -rL $DIR /tmp/r && find /tmp/r -name '*.yaml' -exec sed -i s/__NFS_MEDIA_SERVER__/${NFS_MEDIA_SERVER}/g {} + ; grep -R '__[A-Z_]*__' /tmp/r && { echo 'ERROR: unresolved __PLACEHOLDERS__ — add to atlantis-app-vars secret'; exit 1; } ; n=$(grep -Rh '^kind:' /tmp/r | wc -l) ; kubectl apply -R -f /tmp/r --dry-run=server -o name 2>/dev/null | tee /tmp/a | sed 's/^/would-apply: /' ; a=$(wc -l < /tmp/a) ; [ \"$a\" = \"$n\" ] || { echo \"ERROR: only $a/$n objects validated - one failed silently (stderr suppressed)\"; exit 1; }"
    apply:
      steps:
        # render __VAR__ placeholders from pod env (atlantis-app-vars secret), then apply
        - run: >-
            sh -c "find $DIR -name '*.yaml' -exec sed -i s/__NFS_MEDIA_SERVER__/$NFS_MEDIA_SERVER/g {} + && kubectl apply -R -f $DIR"
