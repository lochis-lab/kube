version: 3
# apps workflow logic lives in scripts/kubectl-apps.sh (version-controlled, testable).
projects:
  - name: terraform-infra
    dir: terraform/infra
    autoplan: { when_modified: ["**/*.tf"] }
    apply_requirements: [mergeable, undiverged]
  - name: terraform-platform
    dir: terraform/platform
    autoplan: { when_modified: ["**/*.tf"] }
    apply_requirements: [mergeable, undiverged]
  - name: apps
    dir: apps
    workflow: kubectl
    autoplan: { when_modified: ["**/*.yaml"] }
    apply_requirements: [mergeable, undiverged]
workflows:
  kubectl:
    plan:
      steps:
        - run: sh ../scripts/kubectl-apps.sh plan $DIR
    apply:
      steps:
        - run: sh ../scripts/kubectl-apps.sh apply $DIR
