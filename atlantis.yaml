version: 3
# apps workflow logic lives in scripts/kubectl-apps.sh (version-controlled, testable).
projects:
  - name: terraform-infra
    dir: terraform/infra
    autoplan: { when_modified: ["**/*.tf"] }
  - name: terraform-platform
    dir: terraform/platform
    autoplan: { when_modified: ["**/*.tf"] }
  - name: terraform-longhorn
    dir: terraform/longhorn
    autoplan: { when_modified: ["**/*.tf"] }
  - name: terraform-apps
    dir: terraform/apps
    autoplan: { when_modified: ["**/*.tf", "**/*.tftpl"] }
